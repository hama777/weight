<html><head><title>血圧集計</title>
    <!-- 26/07/06 月別集計を先頭に表示 -->
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Style-Type" content="text/css">
    <link rel="stylesheet" href="weight.css">
    </head>
    
    <script type="text/javascript" src="https://www.google.com/jsapi"></script>
   
    <script type="text/javascript">
        google.load("visualization", "1", {packages:["corechart"]});
        google.setOnLoadCallback(
            function() {
                var data = google.visualization.arrayToDataTable([
        [       '', '血圧高','血圧低'],
    %month3_graph
                ]);
        
                var options = {
                    title: '血圧',
                    colors: ['#505deb','#e24343'] ,
                    hAxis: {title: '月'},
                    chartArea: { backgroundColor: '#f1f7f9' , left:80,right:30 },
                    backgroundColor: '#d8daf0',
                    legend: {  position: 'none'  }
                };
        
                var chart = new google.visualization.LineChart(document.getElementById('month3_graph'));
                chart.draw(data, options);
            }
        );
    </script>

<script type="text/javascript">
    google.load("visualization", "1", {packages:["corechart"]});
    google.setOnLoadCallback(
        function() {
            var data = google.visualization.arrayToDataTable([
    [       '', '血圧高','血圧低'],
%week_ave_graph
            ]);
    
            var options = {
                title: '血圧',
                colors: ['#505deb','#e24343'] ,
                hAxis: {title: '月'},
                chartArea: { backgroundColor: '#f1f7f9' , left:80,right:30 },
                backgroundColor: '#d8daf0',
                legend: {  position: 'none'  }
            };
    
            var chart = new google.visualization.LineChart(document.getElementById('week_ave_graph'));
            chart.draw(data, options);
        }
    );
</script>

    <h1>血圧集計</h1>
    <span style="font-size:12px;">Ver : %version%</span>
    <span style="font-size:12px;">実行日時   : %today%</span>

    <h2>月別情報</h2>
    <table>
        <tr>
            <th></th><th colspan="4">最高血圧</th><th colspan="4">最低血圧</th>
        </tr>
        <tr>
            <th>年月</th><th>平均</th><th>最大</th><th>最低</th><th>SD</th>
            <th>平均</th><th>最大</th><th>最低</th><th>SD</th>
        </tr>
        %month_info%
    </table>
    <br>
    <h2>血圧グラフ(90日)</h2>
    <div id="month3_graph" style="width:1000px; height:400px;  margin-top:20px ; margin-left:  50px; " ></div>
    <br>
    <h2>血圧グラフ移動平均</h2>
    <div id="week_ave_graph" style="width:1000px; height:400px;  margin-top:20px ; margin-left:  50px; " ></div>
    <br>

</body>
</html>
